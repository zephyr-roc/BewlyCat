name: Build Yab extension

on:
  push:
    branches: [main, safari, safari-integration]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: BewlyCat 上游分支、标签或提交。留空使用当前仓库的代码
        type: string
        default: main
      safari_ref:
        description: BewlyCat-Safari 上游分支、标签或提交
        type: string
        default: safari

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate upstream sources for this build
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          SAFARI_REF: ${{ inputs.safari_ref || 'safari' }}
        run: |
          git config user.name "Yab build"
          git config user.email "ci@localhost"
          merge_source() {
            local repo=$1 ref=$2 sha
            git check-ref-format "refs/build-input/$ref"
            git fetch --no-tags -- "https://github.com/$repo.git" "$ref"
            sha=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
            git merge --no-edit "$sha"
            printf -- '- [%s @ %s](https://github.com/%s/commit/%s)\n' "$repo" "${sha:0:7}" "$repo" "$sha" >> "$GITHUB_STEP_SUMMARY"
          }
          printf -- '- [%s @ %s](%s/%s/commit/%s)\n' "$GITHUB_REPOSITORY" "${GITHUB_SHA:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$UPSTREAM_REF" ]]; then
            merge_source keleus/BewlyCat "$UPSTREAM_REF"
          fi
          merge_source shiinayane/BewlyCat-Safari "$SAFARI_REF"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test --run
      - run: pnpm build-safari

      - name: Package the WebKit extension for Yab
        id: package
        working-directory: extension-safari
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          manifest_file = Path("manifest.json")
          manifest = json.loads(manifest_file.read_text(encoding="utf-8"))
          if "safari" not in manifest.get("browser_specific_settings", {}):
              raise SystemExit("Expected a Safari Web Extension manifest")

          # Yab may use these strings as resource patterns. './dist/...' fails
          # to match the resolved 'dist/...' URL when its loader fetches a script.
          for entry in manifest["content_scripts"]:
              if "js" in entry:
                  scripts = [Path(name) for name in entry["js"]]
                  for script in scripts:
                      if script.is_absolute() or ".." in script.parts or not script.is_file():
                          raise SystemExit(f"Invalid packaged content script: {script}")
                  entry["js"] = [script.as_posix() for script in scripts]

          manifest_file.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          version = manifest["version"]
          run = os.environ["GITHUB_RUN_NUMBER"]
          output = Path(os.environ["RUNNER_TEMP"]) / f"BewlyCat-Yab-{version}-r{run}.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(Path(".").rglob("*")):
                  if path.is_file():
                      archive.write(path, path.as_posix())

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              print(f"path={output}", file=outputs)
          PY

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
