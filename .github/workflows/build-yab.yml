name: Build Yab extension

on:
  push:
    branches: [main, safari, safari-integration]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Include the pinned Safari port
        env:
          SAFARI_COMMIT: 0fb259a807d66b2f6f491166c1c2218abfa2330f
        run: |
          if ! git cat-file -e "$SAFARI_COMMIT^{commit}" 2>/dev/null; then
            git fetch --no-tags https://github.com/shiinayane/BewlyCat-Safari.git "$SAFARI_COMMIT"
          fi
          # Temporary merge for branches that do not yet contain the Safari port.
          git -c user.name=CI -c user.email=ci@localhost merge --no-commit --no-ff "$SAFARI_COMMIT"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run
      - run: pnpm build-safari

      - name: Package the WebKit extension for Yab
        id: package
        working-directory: extension-safari
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          manifest_file = Path("manifest.json")
          manifest = json.loads(manifest_file.read_text(encoding="utf-8"))
          if "safari" not in manifest.get("browser_specific_settings", {}):
              raise SystemExit("Expected a Safari Web Extension manifest")

          # Yab may use these strings as resource patterns. './dist/...' fails
          # to match the resolved 'dist/...' URL when its loader fetches a script.
          for entry in manifest["content_scripts"]:
              if "js" in entry:
                  scripts = [Path(name) for name in entry["js"]]
                  for script in scripts:
                      if script.is_absolute() or ".." in script.parts or not script.is_file():
                          raise SystemExit(f"Invalid packaged content script: {script}")
                  entry["js"] = [script.as_posix() for script in scripts]

          manifest_file.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          version = manifest["version"]
          revision = os.environ["GITHUB_SHA"][:7]
          output = Path(os.environ["RUNNER_TEMP"]) / f"BewlyCat-Yab-{version}-{revision}.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(Path(".").rglob("*")):
                  if path.is_file():
                      archive.write(path, path.as_posix())

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              print(f"path={output}", file=outputs)
          PY

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
